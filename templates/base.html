{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HFinancieros{% endblock %}</title>
  <script>
    // Aplica el tema guardado ANTES de pintar, para evitar el parpadeo de
    // cargar en claro y luego cambiar a oscuro. Ver static/js/theme.js.
    (function () {
      try {
        var t = localStorage.getItem("hf-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* almacenamiento no disponible */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="icon" href="{% static 'img/logo-mark.svg' %}" type="image/svg+xml">
  <link rel="alternate icon" href="{% static 'img/Logo_PNG.png' %}" type="image/png">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% if messages %}
    <ul class="messages" style="margin: 16px 24px 0;">
      {% for message in messages %}
        <li class="message message-{{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  {% block content %}{% endblock %}

  <script src="{% static 'js/theme.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
