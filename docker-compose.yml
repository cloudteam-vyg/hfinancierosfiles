# Uso EXCLUSIVO para desarrollo local. Dokku no usa ni lee este archivo en
# producción (usa Dockerfile + Procfile).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hfinancieros
      POSTGRES_USER: hfinancieros
      POSTGRES_PASSWORD: hfinancieros
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hfinancieros"]
      interval: 5s
      timeout: 5s
      retries: 10


  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    user: "0:0"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://hfinancieros:hfinancieros@db:5432/hfinancieros
    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data:
  media_data:
